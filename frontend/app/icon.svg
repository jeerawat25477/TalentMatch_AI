<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TalentMatch AI">
  <!-- ไอคอนแท็บเบราว์เซอร์ แว่นขยายส่องคน (มาร์กเดียวกับหน้าเข้าสู่ระบบ)
       สีมาจาก token ธีมสว่าง c-primary #0058be ไล่ไป c-primary-container #2170e4
       เขียนเป็นเลขฐานสิบหกตรง เพราะไฟล์นี้อยู่นอก CSS จึงอ่านตัวแปรธีมไม่ได้

       เลนส์เป็นวงกลมขาวทึบ แล้วเจาะรูปคนด้วยสีพื้น ไม่ใช้เส้นขอบบาง
       เพราะที่ขนาด 16px เส้นบางจะเละจนดูไม่ออกว่าเป็นอะไร วงขาวทึบยังอ่านออก

       gradientUnits="userSpaceOnUse" จำเป็น ไม่งั้นแต่ละรูปจะไล่สีตามกรอบของตัวเอง
       สีของรูปคนจะไม่ตรงกับพื้นหลัง -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#0058be"/>
      <stop offset="1" stop-color="#2170e4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <line x1="39" y1="39" x2="51" y2="51"/>
  </g>
  <circle cx="26" cy="26" r="18" fill="#ffffff"/>
  <g fill="url(#g)">
    <circle cx="26" cy="20.5" r="6"/>
    <path d="M16 36a10 10 0 0 1 20 0z"/>
  </g>
</svg>
